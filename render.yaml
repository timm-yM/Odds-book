services:
  - type: web
    name: oddsbook-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: API_URL
        sync: false
      - key: PAYMENT_PROVIDER
        value: pesaflux
      - key: PESAFLUX_API_KEY
        sync: false
      - key: PESAFLUX_EMAIL
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: PLATFORM_FEE_PERCENT
        value: 15
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
